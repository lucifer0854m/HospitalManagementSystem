# Apply a real secret through your cloud secret manager or CI; never commit credentials.
apiVersion: v1
kind: Secret
metadata:
  name: hospital-management-secrets
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=tcp:YOUR_SERVER,1433;Database=HospitalManagementDB;User Id=YOUR_USER;Password=REPLACE_ME;Encrypt=True;TrustServerCertificate=False"
  InitialAdmin__Email: "admin@hospital.local"
  InitialAdmin__Password: "REPLACE_ME"
