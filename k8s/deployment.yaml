apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-management
  labels:
    app: hospital-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-management
  template:
    metadata:
      labels:
        app: hospital-management
    spec:
      containers:
        - name: web
          image: ghcr.io/lucifer0854m/hospital-management-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: hospital-management-config
            - secretRef:
                name: hospital-management-secrets
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
